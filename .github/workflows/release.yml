# Publishes a release when a tag vX.Y.Z is pushed: build once, check the wheel in a clean environment, publish to
# TestPyPI, fetch it back, then publish the same files to PyPI after the owner approves the pypi environment.
# Pull requests run only the build job, so a broken build shows up before a tag is cut. Both indexes trust this
# workflow through trusted publishing, so no API token is stored anywhere.
name: Release

on:
  push:
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.14'
  UV_VERSION: '0.13.7'

jobs:
  build:
    name: build and check the distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # No cache, so nothing a pull request wrote into it can reach a published file
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: false
      - name: Check that the tag names the project version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(uv version --short)"
          if [ "v${version}" != "${TAG}" ]; then
            echo "::error::tag ${TAG} does not match the project version ${version}"
            exit 1
          fi
      - run: uv build
      - name: Install the wheel into a clean environment
        run: |
          uv venv smoke
          uv pip install --python smoke/bin/python dist/*.whl
          smoke/bin/ed2k-client --help
          smoke/bin/python -I -c 'import ed2k_client'
      - run: sha256sum dist/* | tee -a "${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-testpypi:
    name: publish to TestPyPI
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/p/ed2k-client
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/

  verify-testpypi:
    name: install the release from TestPyPI
    needs: publish-testpypi
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: built/
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: false
      # The wheel alone comes from TestPyPI and its dependency from PyPI, because anyone may upload a package of any
      # name to TestPyPI. An index needs a few minutes before a new file appears in its simple API.
      - name: Fetch the wheel back and compare it with the one built
        env:
          TAG: ${{ github.ref_name }}
        run: |
          for _ in $(seq 10); do
            uvx pip download --no-deps --only-binary=:all: --dest fetched \
              --index-url https://test.pypi.org/simple/ "ed2k-client==${TAG#v}" && break
            sleep 30
          done
          cmp fetched/*.whl built/*.whl
          uv venv smoke
          uv pip install --python smoke/bin/python fetched/*.whl
          smoke/bin/ed2k-client --help
          smoke/bin/python -I -c 'import ed2k_client'

  publish-pypi:
    name: publish to PyPI
    needs: verify-testpypi
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The pypi environment requires the owner's approval before this job starts
    environment:
      name: pypi
      url: https://pypi.org/p/ed2k-client
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3

  verify-pypi:
    name: install the release from PyPI
    needs: publish-pypi
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: built/
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: false
      - name: Install the release the way the README tells a user to
        env:
          TAG: ${{ github.ref_name }}
        run: |
          for _ in $(seq 10); do
            uvx pip download --no-deps --only-binary=:all: --dest fetched "ed2k-client==${TAG#v}" && break
            sleep 30
          done
          cmp fetched/*.whl built/*.whl
          uv venv smoke
          uv pip install --python smoke/bin/python --refresh "ed2k-client==${TAG#v}"
          smoke/bin/ed2k-client --help
          smoke/bin/python -I -c 'import ed2k_client'
          uvx --refresh --from "ed2k-client==${TAG#v}" ed2k-client --help
