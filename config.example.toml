# Every setting of ed2k-client with its default value, generated by scripts/render_config_example.py. Copy the file,
# keep the keys you change and pass it with --config. A key that is missing keeps its default, and an unknown key or
# a value of the wrong type is refused.
#
# Paths and lists that have no useful default are shown commented out:
# state_dir = '~/.local/state/ed2k-client'
# download_dir = '~/Downloads/ed2k'
# servers = ['ed2k://|server|85.17.116.222|6082|/']
# server_met = '~/server.met'
# nodes_dat = '~/nodes.dat'
# ip_filter = '~/ipfilter.dat'
# allow_private_peers = false

# The user name shown to servers and peers.
nickname = 'ed2k-client'
# The port announced to servers and used for incoming connections while sharing, 0 for any free port, which the
# listener then takes before the login so that the port it got is the one announced.
tcp_port = 4_662
# The IPv4 address the listener binds while sharing.
listen_host = '0.0.0.0'
# The local Kad port.
udp_port = 4_672
# HTTPS URL of a `server.met`.
server_met_url = 'https://upd.emule-security.org/server.met'
# Servers the client stays logged in to at the same time, each searched and asked for sources.
server_sessions = 4
# HTTPS URL of a `nodes.dat`.
nodes_dat_url = 'https://upd.emule-security.org/nodes.dat'

# Limits of each download.
[download]
# Sources downloaded from at the same time.
max_peers = 4
# Seconds to wait on a connection while queued.
queue_wait = 120.0
# Seconds before asking a queueing peer again. aMule bans a client that asks again within 590 seconds four times, and
# the default is aMule's own `FILEREASKTIME`.
reask_interval = 1300.0
# Seconds between two refreshes of the source list.
source_refresh = 900.0
# Seconds after which the download gives up.
deadline = 21600.0
# Which finished files may leave quarantine.
content_policy = 'documents'
# Seconds between two rounds of starting workers and reporting progress.
poll_interval = 1.0
# Failed connections in a row after which a source is dropped.
max_connect_failures = 3

# How long the client waits on servers, peers and Kad.
[timeouts]
# A TCP connect, including the obfuscation handshake.
connect = 15.0
# Silence on an open TCP connection before it is dropped.
read = 60.0
# From the login request to the assigned ID.
server_login = 45.0
# One page of server search results.
server_search = 30.0
# The source list a server returns for a file.
server_sources = 20.0
# The HTTPS download of `server.met` or `nodes.dat`.
bootstrap_fetch = 30.0

# Caps on everything that arrives from the network.
[limits]
# Bytes of a peer packet other than file data.
control_packet = 524_288
# Bytes of a server packet, whose search pages are large.
server_packet = 4_194_304
# Bytes a zlib payload may inflate to.
unpacked_size = 8_388_608
# Tags in one tag list.
tags = 256
# Bytes of one length-prefixed string.
string_bytes = 65_536
# Results kept from one search.
search_results = 1_000
# Sources kept from one source answer.
sources_per_file = 500
# UTF-8 bytes of a file name written to disk.
filename_bytes = 200
# Bytes of one Kad datagram.
udp_datagram = 8_192
# Entries read from a `server.met`.
server_met_servers = 5_000
# Bytes of a downloaded `server.met`.
server_met_bytes = 2_097_152
# Entries read from a `nodes.dat`.
nodes_dat_contacts = 20_000
# Bytes of a `nodes.dat`.
nodes_dat_bytes = 1_048_576
# Server messages kept for the status.
server_messages = 50
# Characters kept of one server message.
server_message_length = 1_000
# Result pages asked of a server for one search.
server_result_pages = 3
# Unexpected packets a peer may send before the connection is dropped.
ignored_packets = 32

# How Kad lookups and searches spread.
[kad]
# Nodes asked in parallel in each round of a lookup.
alpha = 5
# Closest nodes a lookup converges on.
k = 10
# Rounds after which a lookup stops even if it still gets closer.
max_rounds = 12
# Contacts of `nodes.dat` asked at once during the bootstrap.
bootstrap_fanout = 40
# Live contacts after which the bootstrap stops.
bootstrap_contacts = 60
# Nodes in the tolerance zone that receive the search itself.
search_fanout = 8
# Seconds to collect search answers after the last request.
search_collect = 6.0
# Seconds one Kad UDP request waits for its first answer.
response_timeout = 4.0

# How the client talks to one peer.
[peer]
# 180 KiB blocks asked in one request, at most the three ranges the packet holds.
blocks_per_request = 3
# Bytes of file data sent in one packet while sharing.
send_chunk = 10_240
# Largest random padding of an obfuscation handshake.
obfuscation_padding = 16

# Limits of sharing.
[share]
# Peers served at the same time.
upload_slots = 2
# Incoming connections open at the same time.
max_incoming = 16

# Buffer sizes of local file work.
[io]
# Bytes read at a time while hashing or verifying a file.
read_chunk = 1_048_576
# Bytes read at a time while the content check scans a PDF.
scan_chunk = 1_048_576
# Leading bytes the content check reads to recognise a file type.
head_window = 1_024
