line-length = 120
indent-width = 4
target-version = "py314"  # Match pyupgrade --py314-plus; requires-python is the minimum interpreter version
fix = false # do not fix by default, for CI checks

[format]
quote-style = "single"
indent-style = "space"
docstring-code-format = true
docstring-code-line-length = 120

[lint.flake8-quotes]
avoid-escape = false
docstring-quotes = "double"
inline-quotes = "single"

[lint.flake8-type-checking]
strict = true

[lint.flake8-tidy-imports]
ban-relative-imports = "all"

[lint.pydocstyle]
convention = "pep257"

[lint]
preview = true
fixable = ["ALL"]
unfixable = []
select = [
    "ALL", # Select all rules by default
]
ignore = [
    # Broad category ignores
    "ERA", # eradicate: commented-out code detection (too noisy)
    "FIX", # fixme: TODO/FIXME comments (tracked separately)
    "S", # bandit: security checks (handled by security review, not linter)
    "TD", # todos: TODO format enforcement (tracked separately)
    # Formatter compatibility: ruff format owns these, and the linter would fight it
    "missing-trailing-comma", # COM812
    "prohibited-trailing-comma", # COM819
    "docstring-tab-indentation", # D206
    "indentation-with-invalid-multiple", # E111
    "indentation-with-invalid-multiple-comment", # E114
    "over-indented", # E117
    "bad-quotes-inline-string", # Q000
    "bad-quotes-multiline-string", # Q001
    "bad-quotes-docstring", # Q002
    "avoidable-escaped-quote", # Q003
    # Project-wide policy ignores
    "multi-line-summary-second-line", # D213, conflicts with multi-line-summary-first-line (D212)
    # ruff's pydoclint reads Google and NumPy sections only, so it cannot see the reST fields of the python-coding
    # standard. Its docstring_fields.py checks :returns: and :rtype: on functions and generators alike.
    "docstring-missing-returns", # DOC201
    "docstring-missing-yields", # DOC402
    "docstring-extraneous-yields", # DOC403
    "docstring-missing-exception", # DOC501
    "missing-copyright-notice", # CPY001
    "error-suffix-on-exception-name", # N818, too strict
    "no-self-use", # PLR6301, too noisy
]
extend-ignore = [
    "any-type", # ANN401
    "undocumented-param", # D417
    "mixed-case-variable-in-class-scope", # N815
    "ambiguous-unicode-character-docstring", # RUF002
]
exclude = [
    "*.pyi", ".bzr", ".direnv", ".eggs", ".git", ".hg",
    ".mypy_cache", ".nox", ".pants.d", ".pytest_cache",
    ".ruff_cache", ".svn", ".tox", ".venv", "__pypackages__",
    "_build", "buck-out", "build", "dist", "node_modules", "venv",
]
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[lint.mccabe]
max-complexity = 8 # at full coverage CRAP equals complexity, so 8 is what a CRAP 8 gate allows

[lint.per-file-ignores]
"__init__.py" = [
    "module-import-not-at-top-of-file", # E402
    "unused-import", # F401
]
"tests/**" = [
    "unused-lambda-argument", # ARG005
    "boolean-type-hint-positional-argument", # FBT001, pytest passes parametrized booleans positionally
    "undocumented-public-package", # D104
    "line-too-long", # E501
    "compare-to-empty-string", # PLC1901
    "unnecessary-dunder-call", # PLC2801
    "magic-value-comparison", # PLR2004
    "pytest-fixture-param-without-value", # PT019
    "unnecessary-assign", # RET504
    "private-member-access", # SLF001
    "print", # T201, tests use print
]
"**/cli.py" = [
    "print", # T201, CLI output uses print
]
"scripts/**" = [
    "implicit-namespace-package", # INP001, scripts are run by path and are intentionally not a package
    "print", # T201, scripts report to the terminal with print
]
